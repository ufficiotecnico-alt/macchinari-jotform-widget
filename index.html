<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACCHINARIO</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:12px;color:#222;font-size:14px}
h3{margin:0 0 12px;font-size:16px}
label{display:block;font-weight:700;margin:10px 0 5px}
input,button{box-sizing:border-box;font:inherit}
input{width:100%;padding:9px;border:1px solid #999;border-radius:4px;background:#fff}
button{padding:9px 12px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
.results{border:1px solid #bbb;border-top:0;background:#fff;max-height:260px;overflow:auto}
.result{padding:9px;border-top:1px solid #eee;cursor:pointer}
.result:hover{background:#f3f3f3}
.card{border:1px solid #bbb;border-radius:5px;padding:10px;margin-top:10px;background:#fafafa}
.muted{color:#666;font-size:12px}
.error{color:#a00000;font-size:12px;margin-top:7px}
.hidden{display:none}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.status{margin-top:8px}
</style>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>
<body>
<h3>MACCHINARIO</h3>
<div id="status" class="muted">In attesa del cliente selezionato nel modulo.</div>

<section id="machineSection" class="hidden">
<label for="machineSearch">Macchinario</label>
<input id="machineSearch" type="search" autocomplete="off" placeholder="Cerca marca, descrizione, modello o matricola...">
<div id="machineResults" class="results hidden"></div>
<div id="machineCard" class="card hidden"></div>
<div class="actions">
  <button id="newMachine" type="button">+ Aggiungi nuovo macchinario</button>
  <button id="clear" type="button">Azzera</button>
</div>
</section>

<div id="newForm" class="card hidden">
  <div class="muted">Cliente associato</div>
  <strong id="newClient"></strong>
  <label>Marca</label><input id="newBrand">
  <label>Descrizione</label><input id="newDesc">
  <label>Modello</label><input id="newModel">
  <label>Matricola</label><input id="newSerial">
  <label>Note</label><input id="newNote">
  <div class="actions">
    <button id="saveNew" type="button">Salva macchinario</button>
    <button id="cancelNew" type="button">Annulla</button>
  </div>
  <div id="newError" class="error"></div>
</div>

<script>
const SAMPLE_CLIENTS=[
 {id:'1',name:'TecnoFood',company:'TecnoFood Italia S.p.A.',address:'Via del Lavoro 8',city:'Bologna',province:'BO'},
 {id:'2',name:'Officina Rossi',company:'Rossi Industrial S.r.l.',address:'Via delle Industrie 12',city:'Milano',province:'MI'},
 {id:'3',name:'Pewex',company:'Alpa',address:'Motopoli Sabina',city:'',province:''},
 {id:'4',name:'Prova',company:'xxx',address:'Roma',city:'Ariccia',province:'RM'}
];
let machines=[
 {id:'1',clientId:'2',brand:'FrigoTech',desc:'Unità di refrigerazione',model:'FT-220',serial:'FT220-1932',note:'Installata nel reparto commerciale'},
 {id:'2',clientId:'1',brand:'Komatsu',desc:'Compressore industriale',model:'KX-400',serial:'KX400-8841',note:'Revisione annuale a marzo'},
 {id:'3',clientId:'1',brand:'Orved',desc:'Confezionatrice sottovuoto',model:'VM 18',serial:'ORV-VM18-001',note:'Banco gastronomia'},
 {id:'4',clientId:'1',brand:'Orved',desc:'Confezionatrice sottovuoto',model:'C 33',serial:'ORV-C33-002',note:'Laboratorio'},
 {id:'5',clientId:'3',brand:'Orved',desc:'Termosaldatrice',model:'TS 35',serial:'ORV-TS35-003',note:'Reparto gastronomia'}
];
const CLIENT_SYNC_KEY='assistenza_tecnica_selected_client_v1';
let selectedClient=null,selectedMachine=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resizeWidget(){if(window.JFCustomWidget?.requestFrameResize){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)+8;JFCustomWidget.requestFrameResize({height:h})}}
function scheduleResize(){requestAnimationFrame(resizeWidget)}
function send(){if(window.JFCustomWidget)JFCustomWidget.sendData({value:selectedMachine?JSON.stringify({
 ID_Cliente:selectedClient?.id||'',Nome_Insegna:selectedClient?.name||'',Ragione_Sociale:selectedClient?.company||'',
 ID_Macchinario:selectedMachine.id,Marca:selectedMachine.brand,Descrizione:selectedMachine.desc,Modello:selectedMachine.model,Matricola:selectedMachine.serial,Note:selectedMachine.note||''
}):''})}
function clientFromValue(v){
 const raw=String(v??'').trim();
 if(!raw)return null;
 let data=null;
 try{data=JSON.parse(raw)}catch(e){}
 if(data&&typeof data==='object'){
   const id=String(data.ID_Cliente??data.id??'');
   if(id){const byId=SAMPLE_CLIENTS.find(c=>String(c.id)===id);if(byId)return byId;}
   const name=String(data.Nome_Insegna??'').trim().toLowerCase();
   const company=String(data.Ragione_Sociale??'').trim().toLowerCase();
   const address=String(data.Indirizzo??'').trim().toLowerCase();
   return SAMPLE_CLIENTS.find(c=>
     (!name || c.name.toLowerCase()===name) &&
     (!company || c.company.toLowerCase()===company) &&
     (!address || c.address.toLowerCase()===address)
   )||null;
 }
 return null;
}
function readClientFromSync(){
 let raw='';
 try{raw=localStorage.getItem(CLIENT_SYNC_KEY)||'';}catch(e){}
 if(raw===window._lastClientSync)return;
 window._lastClientSync=raw;
 applyClientValue(raw);
}
function applyClientValue(v){
 const c=clientFromValue(v);
 selectedClient=c;selectedMachine=null;
 $('machineSearch').value='';$('machineResults').innerHTML='';$('machineResults').classList.add('hidden');$('machineCard').classList.add('hidden');$('newForm').classList.add('hidden');
 if(c){
   $('status').innerHTML='<strong>'+esc(c.name)+'</strong> — '+esc(c.company)+' · '+esc(c.address)+(c.city?', '+esc(c.city):'');
   $('machineSection').classList.remove('hidden');
 }else{
   $('status').textContent='Seleziona prima un cliente nel campo Cliente del modulo.';
   $('machineSection').classList.add('hidden');
 }
 send();scheduleResize();
}
function renderResults(list){
 $('machineResults').innerHTML=list.map(m=>`<div class="result" data-id="${esc(m.id)}"><strong>${esc(m.brand)} — ${esc(m.desc)}</strong><br><span class="muted">${esc(m.model)} · Matricola ${esc(m.serial)}</span></div>`).join('');
 $('machineResults').classList.toggle('hidden',!list.length);
 $('machineResults').querySelectorAll('.result').forEach(el=>el.onclick=()=>selectMachine(machines.find(m=>m.id===el.dataset.id)));
 scheduleResize();
}
function selectMachine(m){
 selectedMachine=m;$('machineSearch').value='';$('machineResults').classList.add('hidden');
 $('machineCard').innerHTML=`<strong>${esc(m.brand)} — ${esc(m.desc)}</strong><br>Modello: ${esc(m.model)}<br>Matricola: ${esc(m.serial)}${m.note?'<br>Note: '+esc(m.note):''}`;
 $('machineCard').classList.remove('hidden');send();scheduleResize();
}
$('machineSearch').addEventListener('input',e=>{
 const q=e.target.value.trim().toLowerCase();
 const list=selectedClient?machines.filter(m=>m.clientId===selectedClient.id&&(m.brand+' '+m.desc+' '+m.model+' '+m.serial).toLowerCase().includes(q)):[];
 renderResults(q?list:[]);
});
$('newMachine').onclick=()=>{if(!selectedClient)return;$('newClient').textContent=selectedClient.name+' — '+selectedClient.company;$('newForm').classList.remove('hidden');scheduleResize()};
$('cancelNew').onclick=()=>{$('newForm').classList.add('hidden');scheduleResize()};
$('clear').onclick=()=>{selectedMachine=null;$('machineSearch').value='';$('machineResults').classList.add('hidden');$('machineCard').classList.add('hidden');$('newForm').classList.add('hidden');send();scheduleResize()};
$('saveNew').onclick=()=>{
 $('newError').textContent='';
 const m={id:'NEW-'+Date.now(),clientId:selectedClient.id,brand:$('newBrand').value.trim(),desc:$('newDesc').value.trim(),model:$('newModel').value.trim(),serial:$('newSerial').value.trim(),note:$('newNote').value.trim()};
 if(!m.brand||!m.desc||!m.model||!m.serial){$('newError').textContent='Compila Marca, Descrizione, Modello e Matricola.';return}
 machines.push(m);['newBrand','newDesc','newModel','newSerial','newNote'].forEach(id=>$(id).value='');
 $('newForm').classList.add('hidden');selectMachine(m);
};
if(window.ResizeObserver)new ResizeObserver(scheduleResize).observe(document.body);
if(window.JFCustomWidget){
 JFCustomWidget.subscribe('ready',formData=>{
   readClientFromSync();
   const saved=restoreMachineValue(formData&&formData.value);
   if(saved){
     selectedMachine=saved;
     $('machineCard').innerHTML=`<strong>${esc(saved.brand)} — ${esc(saved.desc)}</strong><br>Modello: ${esc(saved.model)}<br>Matricola: ${esc(saved.serial)}${saved.note?'<br>Note: '+esc(saved.note):''}`;
     $('machineCard').classList.remove('hidden');
   }
   scheduleResize();
   window.addEventListener('storage',e=>{if(e.key===CLIENT_SYNC_KEY)readClientFromSync();});
   setInterval(readClientFromSync,500);
 });
 JFCustomWidget.subscribe('submit',()=>JFCustomWidget.sendSubmit({valid:!!selectedMachine,value:JSON.stringify(selectedMachine||{})}));
}
scheduleResize();
</script>
</body>
</html>
