<!DOCTYPE html>
<html lang="it">
<head>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macchinari V4.7</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-width:0}
body{margin:0;padding:4px 4px 18px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222;overflow-x:hidden}
h1{margin:0 0 10px;text-align:center;font-size:23px;font-weight:700;line-height:1.12}
button{font-family:inherit;cursor:pointer;max-width:100%}
#addMachine{display:block;width:100%;padding:13px 12px;border:2px solid #888;border-radius:12px;background:#fff;font-size:20px;font-weight:700;line-height:1.15}
#addMachine:disabled{opacity:.45;cursor:not-allowed}
#machines{margin-top:12px;width:100%}
.machine{position:relative;width:100%;margin-bottom:14px;padding:13px 12px;border:2px solid #d0d0d0;border-radius:13px;background:#fff;overflow:visible}
.machine-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;margin-bottom:9px;width:100%}
.machine-title{font-size:20px;font-weight:700;line-height:1.1;min-width:0;flex:1 1 180px}
.remove-machine{flex:0 1 auto;width:auto;padding:7px 10px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
select,.spare-search,.qty{width:100%;min-height:43px;padding:7px 10px;border:1px solid #999;border-radius:8px;background:#fff;font-size:16px}
.machine-select{margin-bottom:13px}
.section-title{margin:6px 0 7px;font-size:17px;font-weight:700}
.spare-list{margin-top:6px;width:100%}
.spare-row{position:relative;width:100%;margin-top:8px;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fafafa;overflow:visible}
.spare-grid{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:7px;align-items:center;width:100%}
.spare-search{grid-column:1/-1;font-size:15px}
.spare-unit{min-height:42px;font-size:14px}
.qty{min-height:42px;font-size:15px}
.remove-spare{width:auto;min-height:42px;padding:7px 9px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.spare-results{display:none;position:relative;z-index:10;margin-top:4px;border:1px solid #aaa;border-radius:7px;background:#fff;max-height:180px;overflow:auto}
.spare-option{padding:9px 10px;border-bottom:1px solid #eee;font-size:14px;cursor:pointer}
.spare-option:last-child{border-bottom:0}
.spare-option:hover{background:#f1f1f1}
.add-spare{width:100%;margin-top:8px;padding:9px 11px;border:1px solid #888;border-radius:8px;background:#fff;font-size:15px;font-weight:700}
.status{margin-top:9px;padding:7px 9px;border:1px dashed #aaa;border-radius:7px;font-size:13px;text-align:center;color:#555;word-break:break-word}
#bridgeStatus{display:none}
#emptyStatus{margin-top:12px;padding:11px;border-radius:9px;background:#f5f5f5;text-align:center;color:#666;font-size:15px;display:none}
.note{margin-top:8px;font-size:12px;color:#666}

/* Tablet: use all available width while keeping controls on one line where possible. */
@media (min-width:651px){
  body{padding-left:3px;padding-right:3px}
  .machine{padding-left:13px;padding-right:13px}
}

/* Narrow tablet / large phone */
@media (max-width:650px){
  body{padding:2px 3px 16px}
  h1{font-size:21px;margin-bottom:8px}
  #addMachine{font-size:19px;padding:12px 10px}
  #machines{margin-top:10px}
  .machine{padding:12px 10px;margin-bottom:13px}
  .machine-title{font-size:19px}
  .remove-machine{font-size:13px;padding:6px 9px}
  select,.spare-search,.qty{min-height:42px;font-size:15px}
  .section-title{font-size:16px}
  .spare-grid{grid-template-columns:minmax(0,1fr) 90px auto;gap:6px}
  .spare-unit{font-size:13px}
  .qty{font-size:14px}
  .remove-spare{font-size:13px;padding:6px 8px}
}

/* Phones: stack only the controls that need the extra room. */
@media (max-width:430px){
  .machine-head{align-items:flex-start}
  .machine-title{flex-basis:150px}
  .remove-machine{margin-left:auto}
  .spare-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .spare-search{grid-column:1/-1}
  .spare-unit{grid-column:1/2}
  .qty{grid-column:2/3}
  .remove-spare{grid-column:1/-1;width:100%}
}

/* V4.7: il contenuto occupa tutta la larghezza dell'iframe disponibile. */
body{width:100%;max-width:none;margin:0;padding-left:0;padding-right:0}
.machine,.spare-row{max-width:none}

@media (min-width:700px){
  .machine{padding-left:14px;padding-right:14px}
  .spare-row{padding:11px}
  .spare-grid{grid-template-columns:minmax(0,1fr) 120px 120px;gap:8px}
}

@media (max-width:699px){
  .spare-grid{grid-template-columns:minmax(0,1fr) 105px;gap:7px}
  .spare-search{grid-column:1/-1}
  .spare-unit{grid-column:1/2}
  .qty{grid-column:2/3}
  .remove-spare{grid-column:1/-1;width:100%}
}

@media (max-width:430px){
  .machine-head{gap:6px}
  .machine-title{flex:1 1 140px}
  .remove-machine{width:auto;max-width:100%;font-size:13px}
  .spare-row{padding:9px}
  .spare-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* V4.8 — contenuto scorrevole interno al widget.
   La testata e il pulsante restano visibili; macchinari e ricambi scorrono. */
html,body{height:100%;min-height:0}
body{height:100vh;max-height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
h1{flex:0 0 auto}
#addMachine{flex:0 0 auto}
#contentArea{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:10px;padding:0 2px 14px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable}
#machines{margin-top:0}
#emptyStatus{margin-top:0;margin-bottom:10px}
.machine{overflow:visible}
@media (max-width:650px){
  #contentArea{margin-top:8px;padding-right:2px;padding-bottom:12px}
}
@media (max-width:430px){
  #contentArea{margin-top:7px}
}
</style>
</head>
<body>
<h1>MACCHINARI E RICAMBI UTILIZZATI</h1>
<button id="addMachine" type="button" disabled>+ Aggiungi macchinario</button>
<div id="bridgeStatus" class="status">ID Cliente ponte: lettura in corso…</div>
<div id="contentArea">
  <div id="emptyStatus">Nessun macchinario disponibile per questo cliente.</div>
  <div id="machines"></div>
</div>

<script>
(function(){
 const ALL_MACHINES=[
  {id:'1',clientId:'2',label:'FrigoTech — Unità di refrigerazione — FT-220'},
  {id:'2',clientId:'1',label:'Komatsu — Compressore industriale — KX-400'},
  {id:'3',clientId:'1',label:'Orved — Confezionatrice sottovuoto — VM 18'},
  {id:'4',clientId:'1',label:'Orved — Confezionatrice sottovuoto — C 33'},
  {id:'5',clientId:'3',label:'Orved — Termosaldatrice — TS 35'}
 ];

 // Per questo test i ricambi sono locali: introduciamo la struttura gerarchica
 // senza ancora dipendere dal backend esterno.
 const RICAMBI=[
  {code:'ABC123',name:'Guarnizione coperchio'},
  {code:'DEF456',name:'Resistenza saldante'},
  {code:'GHI789',name:'Nastro teflon'},
  {code:'LMN012',name:'O-ring'},
  {code:'PRS345',name:'Sensore temperatura'},
  {code:'XYZ678',name:'Olio lubrificante'}
 ];
 const UNITS=['pezzi','cm','litri','Kg'];

 let counter=0,availableMachines=[], bridgeId='';

 const $=id=>document.getElementById(id);

 function showStatus(v){
   $('bridgeStatus').textContent='ID Cliente ponte: '+(v||'(nessun valore)');
 }

 function extract(v){
   if(v===null||v===undefined)return '';
   if(typeof v==='string'||typeof v==='number')return String(v).trim();
   if(Array.isArray(v)){
     for(const item of v){const r=extract(item);if(r)return r}
     return '';
   }
   if(typeof v==='object'){
     for(const k of ['value','answer','answerValue']){
       if(v[k]!==undefined&&v[k]!==null){const r=extract(v[k]);if(r)return r}
     }
     for(const k of ['scriviUna26','input_26','26']){
       if(v[k]!==undefined){const r=extract(v[k]);if(r)return r}
     }
     if(v.name==='scriviUna26'&&v.val!==undefined)return extract(v.val);
   }
   return '';
 }

 function renderForClient(id){
   bridgeId=id||'';
   availableMachines=ALL_MACHINES.filter(m=>m.clientId===id);
   $('machines').innerHTML='';
   counter=0;
   $('emptyStatus').style.display=availableMachines.length?'none':'block';
   $('addMachine').disabled=!availableMachines.length;
 }

 function createSpareRow(container){
   const row=document.createElement('div');
   row.className='spare-row';

   const grid=document.createElement('div');
   grid.className='spare-grid';

   const search=document.createElement('input');
   search.className='spare-search';
   search.type='text';
   search.placeholder='Cerca ricambio per codice o descrizione…';
   search.autocomplete='off';

   const unit=document.createElement('select');
   unit.className='spare-unit';
   UNITS.forEach(u=>{
     const o=document.createElement('option');
     o.value=u;o.textContent=u;unit.appendChild(o);
   });

   const qty=document.createElement('input');
   qty.className='qty';
   qty.type='number';
   qty.min='0';
   qty.step='any';
   qty.value='1';
   qty.placeholder='Qtà';

   const remove=document.createElement('button');
   remove.type='button';
   remove.className='remove-spare';
   remove.textContent='Rimuovi';

   const results=document.createElement('div');
   results.className='spare-results';

   let selectedPart=null;

   function showResults(){
     const q=search.value.trim().toLowerCase();
     results.innerHTML='';
     const matches=RICAMBI.filter(r=>
       !q || r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)
     );
     matches.slice(0,20).forEach(r=>{
       const opt=document.createElement('div');
       opt.className='spare-option';
       opt.textContent=r.code+' — '+r.name;
       opt.addEventListener('click',()=>{
         selectedPart=r;
         search.value=r.code+' — '+r.name;
         results.style.display='none';
       });
       results.appendChild(opt);
     });
     results.style.display=matches.length?'block':'none';
   }

   search.addEventListener('focus',showResults);
   search.addEventListener('input',()=>{
     selectedPart=null;
     showResults();
   });
   document.addEventListener('click',e=>{
     if(!row.contains(e.target))results.style.display='none';
   });

   remove.addEventListener('click',()=>row.remove());

   grid.append(search,unit,qty,remove);
   row.append(grid,results);
   container.appendChild(row);
 }

 function addMachine(){
   counter++;
   const b=document.createElement('div');
   b.className='machine';

   const head=document.createElement('div');
   head.className='machine-head';

   const t=document.createElement('div');
   t.className='machine-title';
   t.textContent='Macchinario '+counter;

   const removeMachine=document.createElement('button');
   removeMachine.type='button';
   removeMachine.className='remove-machine';
   removeMachine.textContent='Rimuovi macchinario';

   head.append(t,removeMachine);

   const s=document.createElement('select');
   s.className='machine-select';
   s.innerHTML='<option value="">-- Seleziona un macchinario --</option>';
   availableMachines.forEach(m=>{
     const o=document.createElement('option');
     o.value=m.id;o.textContent=m.label;s.appendChild(o);
   });

   const title=document.createElement('div');
   title.className='section-title';
   title.textContent='RICAMBI UTILIZZATI';

   const spareList=document.createElement('div');
   spareList.className='spare-list';

   const addSpare=document.createElement('button');
   addSpare.type='button';
   addSpare.className='add-spare';
   addSpare.textContent='+ Aggiungi ricambio';
   addSpare.addEventListener('click',()=>createSpareRow(spareList));

   removeMachine.addEventListener('click',()=>b.remove());

   b.append(head,s,title,spareList,addSpare);
   $('machines').appendChild(b);
 }

 function process(data){
   const id=extract(data);
   showStatus(id);
   if(id!==bridgeId)renderForClient(id);
 }

 function readByName(){
   if(typeof JFCustomWidget.getFieldsValueByName!=='function')return;
   JFCustomWidget.getFieldsValueByName(['scriviUna26'],function(data){process(data)});
 }

 $('addMachine').addEventListener('click',addMachine);

 JFCustomWidget.subscribe('ready',function(){
   readByName();
   if(typeof JFCustomWidget.listenFromField==='function'){
     JFCustomWidget.listenFromField('input_26','change',function(value){process(value)});
     JFCustomWidget.listenFromField('input_26','keyup',function(value){process(value)});
   }
 });
})();
</script>
</body>
</html>
