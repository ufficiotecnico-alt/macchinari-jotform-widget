<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Macchinari</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font-family: Arial, sans-serif;
    color: #222;
    background: #fff;
    font-size: 14px;
  }
  h3 { margin: 0 0 12px; font-size: 18px; }
  button, select {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    padding: 10px;
    border: 1px solid #888;
    border-radius: 8px;
    background: #fff;
  }
  button { font-weight: bold; cursor: pointer; }
  .machine {
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fff;
  }
  label {
    display: block;
    font-weight: bold;
    margin: 0 0 6px;
  }
</style>
</head>
<body>

<h3>MACCHINARI — TEST</h3>

<button type="button" id="addMachine">+ Aggiungi macchinario</button>

<div id="machines"></div>

<script>
const SAMPLE_MACHINES = [
  {id:'2', text:'Komatsu — Compressore industriale — KX-400 — KX400-8841'},
  {id:'3', text:'Orved — Confezionatrice sottovuoto — VM 18 — ORV-VM18-001'},
  {id:'4', text:'Orved — Confezionatrice sottovuoto — C 33 — ORV-C33-002'}
];

const machines = document.getElementById('machines');
const addButton = document.getElementById('addMachine');

let counter = 0;

addButton.addEventListener('click', function () {
  counter++;

  const section = document.createElement('div');
  section.className = 'machine';

  const label = document.createElement('label');
  label.textContent = 'Macchinario ' + counter;

  const select = document.createElement('select');

  const empty = document.createElement('option');
  empty.value = '';
  empty.textContent = '-- Seleziona un macchinario --';
  select.appendChild(empty);

  SAMPLE_MACHINES.forEach(function (machine) {
    const option = document.createElement('option');
    option.value = machine.id;
    option.textContent = machine.text;
    select.appendChild(option);
  });

  section.appendChild(label);
  section.appendChild(select);
  machines.appendChild(section);
});
</script>

</body>
</html>
