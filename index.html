<!DOCTYPE html>
<html lang="it">
<head>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macchinari V4.11 Manutenzione automatica</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;min-width:0}
body{margin:0;padding:4px 4px 18px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222;overflow-x:hidden}
h1{margin:0 0 10px;text-align:center;font-size:23px;font-weight:700;line-height:1.12}
button{font-family:inherit;cursor:pointer;max-width:100%}
#addMachine{display:block;width:100%;padding:13px 12px;border:2px solid #888;border-radius:12px;background:#fff;font-size:20px;font-weight:700;line-height:1.15}
#addMachine:disabled{opacity:.45;cursor:not-allowed}
#machines{margin-top:12px;width:100%}
.machine{position:relative;width:100%;margin-bottom:14px;padding:13px 12px;border:2px solid #d0d0d0;border-radius:13px;background:#fff;overflow:visible}
.machine-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;margin-bottom:9px;width:100%}
.machine-title{font-size:20px;font-weight:700;line-height:1.1;min-width:0;flex:1 1 180px}
.remove-machine{flex:0 1 auto;width:auto;padding:7px 10px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
select,.spare-search,.qty{width:100%;min-height:43px;padding:7px 10px;border:1px solid #999;border-radius:8px;background:#fff;font-size:16px}
.machine-select{margin-bottom:13px}
.section-title{margin:6px 0 7px;font-size:17px;font-weight:700}
.spare-list{margin-top:6px;width:100%}
.spare-row{position:relative;width:100%;margin-top:8px;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fafafa;overflow:visible}
.spare-grid{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:7px;align-items:center;width:100%}
.spare-search{grid-column:1/-1;font-size:15px}
.spare-unit{min-height:42px;font-size:14px}
.qty{min-height:42px;font-size:15px}
.remove-spare{width:auto;min-height:42px;padding:7px 9px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.spare-results{display:none;position:relative;z-index:10;margin-top:4px;border:1px solid #aaa;border-radius:7px;background:#fff;max-height:180px;overflow:auto}
.spare-option{padding:9px 10px;border-bottom:1px solid #eee;font-size:14px;cursor:pointer}
.spare-option:last-child{border-bottom:0}
.spare-option:hover{background:#f1f1f1}
.add-spare{width:100%;margin-top:8px;padding:9px 11px;border:1px solid #888;border-radius:8px;background:#fff;font-size:15px;font-weight:700}
.status{margin-top:9px;padding:7px 9px;border:1px dashed #aaa;border-radius:7px;font-size:13px;text-align:center;color:#555;word-break:break-word}
#bridgeStatus{display:none}
#emptyStatus{margin-top:12px;padding:11px;border-radius:9px;background:#f5f5f5;text-align:center;color:#666;font-size:15px;display:none}
.note{margin-top:8px;font-size:12px;color:#666}

/* Tablet: use all available width while keeping controls on one line where possible. */
@media (min-width:651px){
  body{padding-left:3px;padding-right:3px}
  .machine{padding-left:13px;padding-right:13px}
}

/* Narrow tablet / large phone */
@media (max-width:650px){
  body{padding:2px 3px 16px}
  h1{font-size:21px;margin-bottom:8px}
  #addMachine{font-size:19px;padding:12px 10px}
  #machines{margin-top:10px}
  .machine{padding:12px 10px;margin-bottom:13px}
  .machine-title{font-size:19px}
  .remove-machine{font-size:13px;padding:6px 9px}
  select,.spare-search,.qty{min-height:42px;font-size:15px}
  .section-title{font-size:16px}
  .spare-grid{grid-template-columns:minmax(0,1fr) 90px auto;gap:6px}
  .spare-unit{font-size:13px}
  .qty{font-size:14px}
  .remove-spare{font-size:13px;padding:6px 8px}
}

/* Phones: stack only the controls that need the extra room. */
@media (max-width:430px){
  .machine-head{align-items:flex-start}
  .machine-title{flex-basis:150px}
  .remove-machine{margin-left:auto}
  .spare-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .spare-search{grid-column:1/-1}
  .spare-unit{grid-column:1/2}
  .qty{grid-column:2/3}
  .remove-spare{grid-column:1/-1;width:100%}
}

/* V4.7: il contenuto occupa tutta la larghezza dell'iframe disponibile. */
body{width:100%;max-width:none;margin:0;padding-left:0;padding-right:0}
.machine,.spare-row{max-width:none}

@media (min-width:700px){
  .machine{padding-left:14px;padding-right:14px}
  .spare-row{padding:11px}
  .spare-grid{grid-template-columns:minmax(0,1fr) 120px 120px;gap:8px}
}

@media (max-width:699px){
  .spare-grid{grid-template-columns:minmax(0,1fr) 105px;gap:7px}
  .spare-search{grid-column:1/-1}
  .spare-unit{grid-column:1/2}
  .qty{grid-column:2/3}
  .remove-spare{grid-column:1/-1;width:100%}
}

@media (max-width:430px){
  .machine-head{gap:6px}
  .machine-title{flex:1 1 140px}
  .remove-machine{width:auto;max-width:100%;font-size:13px}
  .spare-row{padding:9px}
  .spare-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* V4.8 — contenuto scorrevole interno al widget.
   La testata e il pulsante restano visibili; macchinari e ricambi scorrono. */
html,body{height:100%;min-height:0}
body{height:100vh;max-height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
h1{flex:0 0 auto}
#addMachine{flex:0 0 auto}
#contentArea{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:10px;padding:0 2px 14px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable}
#machines{margin-top:0}
#emptyStatus{margin-top:0;margin-bottom:10px}
.machine{overflow:visible}
@media (max-width:650px){
  #contentArea{margin-top:8px;padding-right:2px;padding-bottom:12px}
}
@media (max-width:430px){
  #contentArea{margin-top:7px}
}

/* Manutenzione programmata */
.maintenance-box{margin:2px 0 13px;padding:11px;border:1px solid #b9c8d8;border-radius:10px;background:#f5f8fb}
.maintenance-heading{font-size:16px;font-weight:700;margin-bottom:8px}
.maintenance-field{display:block;width:100%;margin:6px 0 3px;font-size:13px;font-weight:600}
.maintenance-top-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.maintenance-top-fields .maintenance-field{margin-top:0}
.maintenance-next-date{display:block;width:100%;min-height:41px;padding:8px;border:1px solid #999;border-radius:7px;background:#fff;font:15px Arial,Helvetica,sans-serif;color:#222}
@media(max-width:360px){.maintenance-top-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px}.maintenance-next-date{font-size:13px;padding:6px}}
.maintenance-box input,.maintenance-box textarea,.maintenance-box select{width:100%;min-height:41px;padding:8px;border:1px solid #999;border-radius:7px;background:#fff;font:15px Arial,Helvetica,sans-serif}
.maintenance-box textarea{min-height:58px;resize:vertical}
.maintenance-save{width:100%;margin-top:8px;padding:10px;border:1px solid #667788;border-radius:8px;background:#fff;font-size:15px;font-weight:700}
.maintenance-status{margin-top:8px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.maintenance-existing{padding:8px;margin:6px 0;border-radius:7px;background:#e8f0e8;font-size:13px;line-height:1.45}
.maintenance-date-info{margin:5px 0 9px;font-size:12px;color:#555;line-height:1.4}

</style>
</head>
<body>
<h1>MACCHINARI E RICAMBI UTILIZZATI</h1>
<button id="addMachine" type="button" disabled>+ Aggiungi macchinario al rapporto</button>
<button id="registerMachineToggle" type="button" disabled style="display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #888;border-radius:10px;background:#f5f5f5;font-size:16px;font-weight:700">+ Registra nuovo macchinario per questo cliente</button>
<form id="registerMachineForm" style="display:none;margin-top:8px;padding:12px;border:1px solid #aaa;border-radius:10px;background:#f8f8f8">
<div style="font-size:16px;font-weight:700;margin-bottom:8px">Nuovo macchinario</div>
<label style="display:block;font-size:13px;margin:7px 0 3px">Marca *</label><input name="Marca" required maxlength="100" style="width:100%;min-height:40px;padding:8px;border:1px solid #999;border-radius:7px;font-size:16px">
<label style="display:block;font-size:13px;margin:7px 0 3px">Descrizione *</label><input name="Descrizione" required maxlength="200" style="width:100%;min-height:40px;padding:8px;border:1px solid #999;border-radius:7px;font-size:16px">
<label style="display:block;font-size:13px;margin:7px 0 3px">Modello</label><input name="Modello" maxlength="100" style="width:100%;min-height:40px;padding:8px;border:1px solid #999;border-radius:7px;font-size:16px">
<label style="display:block;font-size:13px;margin:7px 0 3px">Matricola *</label><input name="Matricola" required maxlength="100" style="width:100%;min-height:40px;padding:8px;border:1px solid #999;border-radius:7px;font-size:16px">
<label style="display:block;font-size:13px;margin:7px 0 3px">Note</label><textarea name="Note" rows="2" maxlength="500" style="width:100%;padding:8px;border:1px solid #999;border-radius:7px;font-size:16px"></textarea>
<div id="registerMachineStatus" role="status" style="margin-top:8px;font-size:13px"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button type="submit" id="saveNewMachine" style="flex:1;padding:10px;border:1px solid #777;border-radius:8px;background:#fff;font-weight:700">Salva macchinario</button><button type="button" id="cancelNewMachine" style="padding:10px;border:1px solid #aaa;border-radius:8px;background:#fff">Annulla</button></div>
</form>
<div id="bridgeStatus" class="status">ID Cliente ponte: lettura in corso…</div>
<div id="contentArea">
  <div id="emptyStatus">Nessun macchinario disponibile per questo cliente.</div>
  <div id="machines"></div>
</div>

<script>
(function(){
 const API_URL='https://script.google.com/macros/s/AKfycbyxdCMuqQ-jH7WrS1fvGLTEYeZ3VgZIqaUQc4Bqtm-te-smG18989Zv9WrnRwllq9V8/exec';
 const UNITS=['pezzi','cm','litri','Kg'];

 let counter=0,availableMachines=[], bridgeId='';

 const $=id=>document.getElementById(id);

 function showStatus(v){
   $('bridgeStatus').textContent='ID Cliente ponte: '+(v||'(nessun valore)');
 }

 function extract(v){
   if(v===null||v===undefined)return '';
   if(typeof v==='string'||typeof v==='number')return String(v).trim();
   if(Array.isArray(v)){
     for(const item of v){const r=extract(item);if(r)return r}
     return '';
   }
   if(typeof v==='object'){
     for(const k of ['value','answer','answerValue']){
       if(v[k]!==undefined&&v[k]!==null){const r=extract(v[k]);if(r)return r}
     }
     for(const k of ['scriviUna26','input_26','26']){
       if(v[k]!==undefined){const r=extract(v[k]);if(r)return r}
     }
     if(v.name==='scriviUna26'&&v.val!==undefined)return extract(v.val);
   }
   return '';
 }

 async function renderForClient(id){
   bridgeId=id||'';
   availableMachines=[];
   $('machines').innerHTML='';
   counter=0;
   $('addMachine').disabled=true;
   $('registerMachineToggle').disabled=!id;
   $('registerMachineForm').style.display='none';
   $('registerMachineStatus').textContent='';
   $('emptyStatus').textContent=id?'Caricamento macchinari…':'Seleziona prima un cliente.';
   $('emptyStatus').style.display='block';
   if(!id)return;
   try{
     const response=await fetch(API_URL+'?action=macchinari&clientId='+encodeURIComponent(id));
     if(!response.ok)throw new Error('HTTP '+response.status);
     const data=await response.json();
     if(!data||data.ok!==true||!Array.isArray(data.results))throw new Error((data&&data.error)||'Risposta non valida');
     availableMachines=data.results.map(m=>{
       const id=String(m.ID_Macchinario||'').trim();
       const brand=String(m.Marca||'').trim();
       const desc=String(m.Descrizione||'').trim();
       const model=String(m.Modello||'').trim();
       const serial=String(m.Matricola||'').trim();
       return {id,label:[brand,desc,model,serial].filter(Boolean).join(' — '),raw:m};
     }).filter(m=>m.id);
     $('emptyStatus').textContent=availableMachines.length?'':'Nessun macchinario disponibile per questo cliente.';
     $('emptyStatus').style.display=availableMachines.length?'none':'block';
     $('addMachine').disabled=!availableMachines.length;
   }catch(err){
     $('emptyStatus').textContent='Errore nel caricamento dei macchinari: '+String(err.message||err);
     $('emptyStatus').style.display='block';
   }
 }

 function createSpareRow(container, getMachineBrand){
   const row=document.createElement('div');
   row.className='spare-row';

   const grid=document.createElement('div');
   grid.className='spare-grid';

   const search=document.createElement('input');
   search.className='spare-search';
   search.type='text';
   search.placeholder='Cerca ricambio per codice o descrizione…';
   search.autocomplete='off';

   const unit=document.createElement('select');
   unit.className='spare-unit';
   UNITS.forEach(u=>{
     const o=document.createElement('option');
     o.value=u;o.textContent=u;unit.appendChild(o);
   });

   const qty=document.createElement('input');
   qty.className='qty';
   qty.type='number';
   qty.min='0';
   qty.step='any';
   qty.value='1';
   qty.placeholder='Qtà';

   const remove=document.createElement('button');
   remove.type='button';
   remove.className='remove-spare';
   remove.textContent='Rimuovi';

   const results=document.createElement('div');
   results.className='spare-results';

   let selectedPart=null;

   let searchTimer=null, requestSerial=0;
   async function showResults(){
     const q=search.value.trim(), serial=++requestSerial;
     results.innerHTML='';
     if(!q){results.style.display='none';return;}
     const loading=document.createElement('div');
     loading.className='spare-option'; loading.textContent='Ricerca in corso…';
     results.appendChild(loading); results.style.display='block';
     try{
       const brand = typeof getMachineBrand === 'function' ? String(getMachineBrand() || '').trim() : '';
      const response=await fetch(API_URL+'?action=ricambi&q='+encodeURIComponent(q)+'&marca='+encodeURIComponent(brand));
       if(!response.ok)throw new Error('HTTP '+response.status);
       const data=await response.json();
       if(serial!==requestSerial)return;
       if(!data||data.ok!==true||!Array.isArray(data.results))throw new Error((data&&data.error)||'Risposta non valida');
       results.innerHTML='';
       const matches=data.results.slice(0,20).map(r=>({
         id:String(r.ID_Ricambio||'').trim(),code:String(r.Codice||'').trim(),
         name:String(r.Descrizione||'').trim(),brand:String(r.Marca||'').trim()
       }));
       matches.forEach(r=>{
         const opt=document.createElement('div'); opt.className='spare-option';
         opt.textContent=r.code+' — '+r.name+(r.brand?' ('+r.brand+')':'');
         opt.addEventListener('click',()=>{
           selectedPart=r; row._selectedPart=r;
           search.value=r.code+' — '+r.name;
           results.style.display='none';
         });
         results.appendChild(opt);
       });
       if(!matches.length){
         const empty=document.createElement('div'); empty.className='spare-option';
         empty.textContent='Nessun ricambio trovato. Puoi inserire una descrizione manuale.';
         results.appendChild(empty);
       }
     }catch(err){
       if(serial!==requestSerial)return;
       results.innerHTML='';
       const error=document.createElement('div'); error.className='spare-option';
       error.textContent='Errore nella ricerca: '+String(err.message||err);
       results.appendChild(error);
     }
     results.style.display='block';
   }

   search.addEventListener('focus',()=>{if(search.value.trim())showResults();});
   search.addEventListener('input',()=>{
     selectedPart=null;
     showResults();
   });
   document.addEventListener('click',e=>{
     if(!row.contains(e.target))results.style.display='none';
   });

   remove.addEventListener('click',()=>row.remove());

   grid.append(search,unit,qty,remove);
   row.append(grid,results);
   container.appendChild(row);
 }

 function italianDate(value){
   if(!value)return '—';
   const s=String(value).trim();
   const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
   if(iso)return iso[3]+'-'+iso[2]+'-'+iso[1];
   const it=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
   return it ? it[1].padStart(2,'0')+'-'+it[2].padStart(2,'0')+'-'+it[3] : s;
 }

 async function loadMachineMaintenance(machineId, box){
   const status=box.querySelector('.maintenance-status');
   const existing=box.querySelector('.maintenance-existing');
   existing.style.display='none'; existing.textContent='';
   status.textContent='Verifica manutenzione in corso…';
   if(!machineId){status.textContent='Seleziona un macchinario per verificare la manutenzione.';return;}
   try{
     const response=await fetch(API_URL+'?action=verificamanutenzione&ID_Macchinario='+encodeURIComponent(machineId));
     if(!response.ok)throw new Error('HTTP '+response.status);
     const data=await response.json();
     if(!data||data.ok!==true)throw new Error((data&&data.error)||'Risposta non valida');
     const rows=Array.isArray(data.registrazioni)?data.registrazioni:[];
     const scheduled=rows.filter(r=>String(r.Stato||'').toUpperCase()==='PROGRAMMATA');
     if(scheduled.length){
       const r=scheduled[0];
       existing.innerHTML='';
       const strong=document.createElement('strong'); strong.textContent='Manutenzione già programmata'; existing.appendChild(strong);
       const details=document.createElement('div');
       details.textContent='Periodicità: '+(r.Periodicita||'—')+' · Prossima manutenzione: '+italianDate(r.Data_Scadenza)+' · Stato: '+(r.Stato||'—');
       existing.appendChild(details); existing.style.display='block';
       box.querySelector('.maintenance-save').disabled=true;
       status.textContent='Per evitare duplicati, non è possibile registrare una seconda manutenzione programmata per questo macchinario.';
     }else{
       box.querySelector('.maintenance-save').disabled=false;
       status.textContent=rows.length?'Non risultano manutenzioni attualmente programmate.':'Nessuna manutenzione registrata per questo macchinario.';
     }
   }catch(err){status.textContent='Verifica non riuscita: '+String(err.message||err);}
 }

 function parseInterventionDate(value){
   if(value===null||value===undefined)return null;
   if(typeof value==='object'){
     for(const key of ['value','answer','answerValue','data']){
       if(value[key]!==undefined){const parsed=parseInterventionDate(value[key]);if(parsed)return parsed;}
     }
     for(const key of ['month_27','day_27','year_27','month','day','year']){
       if(value[key]!==undefined){}
     }
     return null;
   }
   const text=String(value).trim();
   if(!text)return null;
   let m=text.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
   if(m){
     // Il modulo mostra la data come MM/DD/YYYY; accetta anche DD/MM/YYYY.
     const a=Number(m[1]), b=Number(m[2]), y=Number(m[3]);
     let month, day;
     if(a>12){day=a;month=b;} else {month=a;day=b;}
     const d=new Date(y,month-1,day,12,0,0);
     return d.getFullYear()===y&&d.getMonth()===month-1&&d.getDate()===day?d:null;
   }
   m=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
   if(m){const y=+m[1],mo=+m[2],day=+m[3],d=new Date(y,mo-1,day,12,0,0);return d.getFullYear()===y&&d.getMonth()===mo-1&&d.getDate()===day?d:null;}
   return null;
 }
 function addMonthsClamped(date, months){
   const first=new Date(date.getFullYear(),date.getMonth()+months,1,12,0,0);
   const lastDay=new Date(first.getFullYear(),first.getMonth()+1,0,12,0,0).getDate();
   return new Date(first.getFullYear(),first.getMonth(),Math.min(date.getDate(),lastDay),12,0,0);
 }
 function formatDateDDMMYYYY(date){
   return date ? String(date.getDate()).padStart(2,'0')+'/'+String(date.getMonth()+1).padStart(2,'0')+'/'+date.getFullYear() : '';
 }
 function getInterventionDate(){
   if(typeof JFCustomWidget.getFieldsValueByName!=='function')return null;
   return new Promise(resolve=>{
     try{JFCustomWidget.getFieldsValueByName(['data'],function(data){
       let raw='';
       if(data&&typeof data==='object'){
         raw=data.data!==undefined?data.data:(data.value!==undefined?data.value:data);
       } else raw=data;
       resolve(parseInterventionDate(raw));
     });}catch(e){resolve(null);}
   });
 }
 function createMaintenanceBox(machineSelect){
   const box=document.createElement('section'); box.className='maintenance-box';
   const heading=document.createElement('div'); heading.className='maintenance-heading'; heading.textContent='MANUTENZIONE PROGRAMMATA';
   const existing=document.createElement('div'); existing.className='maintenance-existing'; existing.style.display='none';
   const top=document.createElement('div'); top.className='maintenance-top-fields';
   const periodicityWrap=document.createElement('div');
   const periodicityLabel=document.createElement('label'); periodicityLabel.className='maintenance-field'; periodicityLabel.textContent='Periodicità';
   const periodicity=document.createElement('select'); periodicity.className='maintenance-periodicity';
   [['','-- Seleziona --'],['3 mesi','3 mesi'],['6 mesi','6 mesi'],['1 anno','1 anno']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;periodicity.appendChild(o)});
   const dateWrap=document.createElement('div');
   const dateLabel=document.createElement('label'); dateLabel.className='maintenance-field'; dateLabel.textContent='Prossima manutenzione';
   const nextDate=document.createElement('output'); nextDate.className='maintenance-next-date'; nextDate.textContent='—'; nextDate.setAttribute('aria-live','polite');
   periodicityWrap.append(periodicityLabel,periodicity); dateWrap.append(dateLabel,nextDate); top.append(periodicityWrap,dateWrap);
   const notesLabel=document.createElement('label'); notesLabel.className='maintenance-field'; notesLabel.textContent='Note';
   const notes=document.createElement('textarea'); notes.className='maintenance-notes'; notes.maxLength=1000; notes.placeholder='Note per il tecnico (facoltative)';
   const save=document.createElement('button'); save.type='button'; save.className='maintenance-save'; save.textContent='Salva manutenzione programmata';
   const status=document.createElement('div'); status.className='maintenance-status'; status.setAttribute('role','status'); status.textContent='Seleziona un macchinario per verificare la manutenzione.';
   let interventionDate=null;
   async function updateNextDate(){
     interventionDate=await getInterventionDate();
     const months={'3 mesi':3,'6 mesi':6,'1 anno':12}[periodicity.value];
     if(!interventionDate){nextDate.textContent='Data intervento non letta';return;}
     nextDate.textContent=months?formatDateDDMMYYYY(addMonthsClamped(interventionDate,months)):'—';
   }
   periodicity.addEventListener('change',updateNextDate);
   save.addEventListener('click',async()=>{
     const machineId=machineSelect.value;
     if(!machineId){status.textContent='Seleziona prima un macchinario.';return;}
     if(!periodicity.value){status.textContent='Seleziona la periodicità.';periodicity.focus();return;}
     interventionDate=await getInterventionDate();
     if(!interventionDate){status.textContent='Non riesco a leggere la Data intervento. Verifica che sia compilata prima di salvare.';return;}
     const months={'3 mesi':3,'6 mesi':6,'1 anno':12}[periodicity.value];
     const plannedDate=addMonthsClamped(interventionDate,months);
     nextDate.textContent=formatDateDDMMYYYY(plannedDate);
     save.disabled=true; status.textContent='Salvataggio in corso…';
     try{
       const body=new URLSearchParams();
       body.append('action','salvaconfigurazionemanutenzione');
       body.append('ID_Macchinario',machineId);
       body.append('Periodicita_Manutenzione',periodicity.value);
       // L'API usa la data dell'intervento come base e calcola la scadenza futura.
       body.append('Data_Pianificazione',interventionDate.getFullYear()+'-'+String(interventionDate.getMonth()+1).padStart(2,'0')+'-'+String(interventionDate.getDate()).padStart(2,'0'));
       body.append('Note_Manutenzione',notes.value.trim());
       const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
       if(!response.ok)throw new Error('HTTP '+response.status);
       const result=await response.json();
       if(!result||result.ok!==true)throw new Error((result&&result.error)||'Il server non ha confermato il salvataggio.');
       status.textContent='Manutenzione programmata salvata correttamente. Prossima data: '+formatDateDDMMYYYY(plannedDate)+'.';
       await loadMachineMaintenance(machineId,box);
     }catch(err){status.textContent='Salvataggio non riuscito: '+String(err.message||err);save.disabled=false;}
   });
   machineSelect.addEventListener('change',()=>loadMachineMaintenance(machineSelect.value,box));
   box.append(heading,existing,top,notesLabel,notes,save,status);
   updateNextDate();
   return box;
 }

 function addMachine(){
   counter++;
   const b=document.createElement('div');
   b.className='machine';

   const head=document.createElement('div');
   head.className='machine-head';

   const t=document.createElement('div');
   t.className='machine-title';
   t.textContent='Macchinario '+counter;

   const removeMachine=document.createElement('button');
   removeMachine.type='button';
   removeMachine.className='remove-machine';
   removeMachine.textContent='Rimuovi macchinario';

   head.append(t,removeMachine);

   const s=document.createElement('select');
   s.className='machine-select';
   s.innerHTML='<option value="">-- Seleziona un macchinario --</option>';
   availableMachines.forEach(m=>{
     const o=document.createElement('option');
     o.value=m.id;o.textContent=m.label;s.appendChild(o);
   });

   const maintenanceBox=createMaintenanceBox(s);

   const title=document.createElement('div');
   title.className='section-title';
   title.textContent='RICAMBI UTILIZZATI';

   const spareList=document.createElement('div');
   spareList.className='spare-list';

   const addSpare=document.createElement('button');
   addSpare.type='button';
   addSpare.className='add-spare';
   addSpare.textContent='+ Aggiungi ricambio';
   addSpare.addEventListener('click',()=>createSpareRow(spareList,()=>{
     const selected=availableMachines.find(m=>m.id===s.value);
     return selected ? String(selected.raw.Marca||'').trim() : '';
   }));

   removeMachine.addEventListener('click',()=>b.remove());

   b.append(head,s,maintenanceBox,title,spareList,addSpare);
   $('machines').appendChild(b);
   if(s.value)loadMachineMaintenance(s.value,maintenanceBox);
 }

 function process(data){
   const id=extract(data);
   showStatus(id);
   if(id!==bridgeId)renderForClient(id);
 }

 function readByName(){
   if(typeof JFCustomWidget.getFieldsValueByName!=='function')return;
   JFCustomWidget.getFieldsValueByName(['scriviUna26'],function(data){process(data)});
 }



 $('registerMachineToggle').addEventListener('click',function(){
   if(!bridgeId){$('registerMachineStatus').textContent='Seleziona prima un cliente.';return;}
   const form=$('registerMachineForm');
   form.style.display=form.style.display==='none'?'block':'none';
 });
 $('cancelNewMachine').addEventListener('click',function(){
   $('registerMachineForm').reset();
   $('registerMachineStatus').textContent='';
   $('registerMachineForm').style.display='none';
 });
 $('registerMachineForm').addEventListener('submit',async function(event){
   event.preventDefault();
   if(!bridgeId){$('registerMachineStatus').textContent='Errore: seleziona prima un cliente.';return;}
   const form=$('registerMachineForm'), save=$('saveNewMachine'), fields=new FormData(form);
   const payload={action:'aggiungimacchinario',ID_Cliente:bridgeId,
     Marca:String(fields.get('Marca')||'').trim(),
     Descrizione:String(fields.get('Descrizione')||'').trim(),
     Modello:String(fields.get('Modello')||'').trim(),
     Matricola:String(fields.get('Matricola')||'').trim(),
     Note:String(fields.get('Note')||'').trim()};
   if(!payload.Marca||!payload.Descrizione||!payload.Matricola){
     $('registerMachineStatus').textContent='Compila Marca, Descrizione e Matricola.';return;
   }
   save.disabled=true;
   $('registerMachineStatus').textContent='Salvataggio in corso…';
   try{
     const body=new URLSearchParams();
     Object.entries(payload).forEach(([key,value])=>body.append(key,value));
     const response=await fetch(API_URL,{method:'POST',
       headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
     if(!response.ok)throw new Error('HTTP '+response.status);
     const result=await response.json();
     if(!result||result.ok!==true)throw new Error((result&&result.error)||'Il server non ha confermato il salvataggio.');
     form.reset();form.style.display='none';
     await renderForClient(bridgeId);
     $('emptyStatus').textContent='Macchinario salvato e associato al cliente.';
     $('emptyStatus').style.display='block';
   }catch(err){
     $('registerMachineStatus').textContent='Salvataggio non riuscito: '+String(err.message||err);
   }finally{save.disabled=false;}
 });
 $('addMachine').addEventListener('click',addMachine);

 function collectWidgetData(){
   const machines=[];
   document.querySelectorAll('#machines .machine').forEach(block=>{
     const sel=block.querySelector('.machine-select');
     const machine=availableMachines.find(m=>m.id===sel.value);
     if(!machine||!sel.value)return;
     const parts=[];
     block.querySelectorAll('.spare-row').forEach(row=>{
       const input=row.querySelector('.spare-search'), unit=row.querySelector('.spare-unit'), qty=row.querySelector('.qty');
       if(!input||!input.value.trim())return;
       const part=row._selectedPart||null;
       parts.push({ID_Ricambio:part?part.id:'',Marca:part?part.brand:'',Codice:part?part.code:'',Descrizione:part?part.name:input.value.trim(),UnitaMisura:unit?unit.value:'pezzi',Quantita:qty?qty.value:'1',Origine:part?'ANAGRAFICA':'INSERIMENTO_MANUALE'});
     });
     machines.push({ID_Macchinario:machine.id,Marca:machine.raw.Marca||'',Descrizione:machine.raw.Descrizione||'',Modello:machine.raw.Modello||'',Matricola:String(machine.raw.Matricola||'').trim(),Ricambi:parts});
   });
   return {ID_Cliente:bridgeId,Macchinari:machines};
 }
 JFCustomWidget.subscribe('submit',function(){JFCustomWidget.sendSubmit({valid:true,value:JSON.stringify(collectWidgetData())});});


 JFCustomWidget.subscribe('ready',function(){
   readByName();
   if(typeof JFCustomWidget.listenFromField==='function'){
     JFCustomWidget.listenFromField('input_26','change',function(value){process(value)});
     JFCustomWidget.listenFromField('input_26','keyup',function(value){process(value)});
   }
 });
})();
</script>
